name: Deploy D1 Hoops to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "30 11 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Audit dependency vulnerabilities
        run: |
          npm audit --json > "$RUNNER_TEMP/npm-audit.json" || true
          node -e 'const a = JSON.parse(require("node:fs").readFileSync(process.env.RUNNER_TEMP + "/npm-audit.json", "utf8")); console.log("Dependency audit:", JSON.stringify(a.metadata?.vulnerabilities ?? {})); for (const [name, item] of Object.entries(a.vulnerabilities ?? {})) console.log(name + ": " + item.severity + " | range " + item.range + " | fix " + JSON.stringify(item.fixAvailable));'
      - name: Fetch current-season team statistics and ratings
        if: github.event_name != 'push' || !hashFiles('public/data/team-season-2027.json') || !hashFiles('public/data/player-season-2027.json') || !hashFiles('public/data/games-season-2027.json') || !hashFiles('public/data/game-team-boxscores-2027.json') || !hashFiles('public/data/player-details-2027/*.json') || !hashFiles('public/data/overview-2027.json')
        run: node scripts/fetch-team-stats.mjs
        env:
          CBBD_API_KEY: ${{ secrets.CBBD_API_KEY }}
      - name: Fetch and validate current-season player stats
        if: github.event_name != 'push' || !hashFiles('public/data/team-season-2027.json') || !hashFiles('public/data/player-season-2027.json') || !hashFiles('public/data/games-season-2027.json') || !hashFiles('public/data/game-team-boxscores-2027.json') || !hashFiles('public/data/player-details-2027/*.json')
        run: node scripts/fetch-player-stats.mjs
        env:
          CBBD_API_KEY: ${{ secrets.CBBD_API_KEY }}
      - name: Fetch and validate current-season game schedule and results
        if: github.event_name != 'push' || !hashFiles('public/data/team-season-2027.json') || !hashFiles('public/data/player-season-2027.json') || !hashFiles('public/data/games-season-2027.json') || !hashFiles('public/data/game-team-boxscores-2027.json') || !hashFiles('public/data/player-details-2027/*.json')
        run: node scripts/fetch-games.mjs
        env:
          CBBD_API_KEY: ${{ secrets.CBBD_API_KEY }}
      - name: Fetch player shooting profiles weekly
        run: node scripts/fetch-player-shooting.mjs
        env:
          CBBD_API_KEY: ${{ secrets.CBBD_API_KEY }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
      - name: Build compact overview snapshot
        run: node scripts/build-overview.mjs
      - name: Save refreshed current-season data snapshots
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || github.event_name == 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json public/data/
          if ! git diff --cached --quiet; then
            git commit -m 'Update 2026-27 basketball data snapshots'
            git push
          fi
      - name: Build static site
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /D1-Basketball-Analytics
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
