name: Deploy D1 Hoops to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "30 11 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Fetch and validate current-season player stats
        run: node scripts/fetch-player-stats.mjs
        env:
          CBBD_API_KEY: ${{ secrets.CBBD_API_KEY }}
      - name: Build static site
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /D1-Basketball-Analytics
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
