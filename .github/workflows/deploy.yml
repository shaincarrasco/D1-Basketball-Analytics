name: Deploy D1 Hoops to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "30 11 * * *" # full refresh (College Basketball Data + ESPN), 6:30 a.m. ET
    # Hourly ESPN-only refreshes from noon to 4 a.m. ET: new finals move ratings, records, schedules
    # and simulations within the hour. Off-the-hour minute because GitHub delays :00 crons the most.
    - cron: "17 0-8,16-23 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Audit dependency vulnerabilities
        run: |
          npm audit --json > "$RUNNER_TEMP/npm-audit.json" || true
          node -e 'const a = JSON.parse(require("node:fs").readFileSync(process.env.RUNNER_TEMP + "/npm-audit.json", "utf8")); console.log("Dependency audit:", JSON.stringify(a.metadata?.vulnerabilities ?? {})); for (const [name, item] of Object.entries(a.vulnerabilities ?? {})) console.log(name + ": " + item.severity + " | range " + item.range + " | fix " + JSON.stringify(item.fixAvailable));'
      - name: Fetch and validate current-season player stats
        if: (github.event_name != 'schedule' || github.event.schedule == '30 11 * * *') && (github.event_name != 'push' || contains(github.event.head_commit.message, '[refresh-data]') || !hashFiles('public/data/team-season-2027.json') || !hashFiles('public/data/player-season-2027.json') || !hashFiles('public/data/games-season-2027.json') || !hashFiles('public/data/game-team-boxscores-2027.json') || !hashFiles('public/data/player-details-2027/*.json'))
        run: node scripts/fetch-player-stats.mjs
        env:
          CBBD_API_KEY: ${{ secrets.CBBD_API_KEY }}
      - name: Fetch current-season team statistics and ratings
        if: (github.event_name != 'schedule' || github.event.schedule == '30 11 * * *') && (github.event_name != 'push' || contains(github.event.head_commit.message, '[refresh-data]') || !hashFiles('public/data/team-season-2027.json') || !hashFiles('public/data/player-season-2027.json') || !hashFiles('public/data/games-season-2027.json') || !hashFiles('public/data/game-team-boxscores-2027.json') || !hashFiles('public/data/player-details-2027/*.json'))
        run: node scripts/fetch-team-stats.mjs
        env:
          CBBD_API_KEY: ${{ secrets.CBBD_API_KEY }}
      - name: Fetch and validate current-season game schedule and results
        if: (github.event_name != 'schedule' || github.event.schedule == '30 11 * * *') && (github.event_name != 'push' || contains(github.event.head_commit.message, '[refresh-data]') || !hashFiles('public/data/team-season-2027.json') || !hashFiles('public/data/player-season-2027.json') || !hashFiles('public/data/games-season-2027.json') || !hashFiles('public/data/game-team-boxscores-2027.json') || !hashFiles('public/data/player-details-2027/*.json'))
        run: node scripts/fetch-games.mjs
        env:
          CBBD_API_KEY: ${{ secrets.CBBD_API_KEY }}
      - name: Fetch last season's ratings once (preseason prior for DHR)
        if: github.event_name != 'schedule' || github.event.schedule == '30 11 * * *'
        run: node scripts/fetch-prior-ratings.mjs
        env:
          CBBD_API_KEY: ${{ secrets.CBBD_API_KEY }}
      - name: Fetch player game logs and roster bios (ESPN, incremental)
        continue-on-error: true
        run: node scripts/fetch-espn-player-games.mjs
      - name: Fetch recruiting star ratings (non-fatal)
        if: github.event_name != 'schedule' || github.event.schedule == '30 11 * * *'
        continue-on-error: true
        run: node scripts/fetch-recruiting.mjs
        env:
          CBBD_API_KEY: ${{ secrets.CBBD_API_KEY }}
      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            live/target
          key: rust-${{ runner.os }}-${{ hashFiles('live/Cargo.toml', 'live/Cargo.lock') }}
      - name: Fetch news, previews/recaps, polls and injury reports (Rust)
        continue-on-error: true
        run: cargo run --release --manifest-path live/Cargo.toml --bin feeds
      - name: Fill results the schedule provider hasn't published yet (ESPN box scores)
        run: node scripts/merge-espn-finals.mjs
      - name: Calculate DHR v2 ratings, walk-forward predictions and backtest
        run: node scripts/build-power-ratings.mjs
      - name: Simulate the rest of the season
        run: node scripts/build-simulations.mjs
      - name: Fetch player shooting profiles weekly
        if: github.event_name != 'schedule' || github.event.schedule == '30 11 * * *'
        run: node scripts/fetch-player-shooting.mjs
        env:
          CBBD_API_KEY: ${{ secrets.CBBD_API_KEY }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
      - name: Fetch past seasons once (history, cached per season)
        if: github.event_name != 'schedule' || github.event.schedule == '30 11 * * *'
        continue-on-error: true
        run: node scripts/fetch-history.mjs
        env:
          CBBD_API_KEY: ${{ secrets.CBBD_API_KEY }}
      - name: Fetch past player seasons once (cached per season, not served)
        if: github.event_name != 'schedule' || github.event.schedule == '30 11 * * *'
        continue-on-error: true
        run: node scripts/fetch-player-history.mjs
        env:
          CBBD_API_KEY: ${{ secrets.CBBD_API_KEY }}
      - name: Fetch transfer portal entries (non-fatal)
        if: github.event_name != 'schedule' || github.event.schedule == '30 11 * * *'
        continue-on-error: true
        run: node scripts/fetch-portal.mjs
        env:
          CBBD_API_KEY: ${{ secrets.CBBD_API_KEY }}
      - name: Refresh tennis data (Baseline site; cached, only new matches are fetched)
        run: node apps/tennis/scripts/fetch-tennis.mjs || echo "::warning::Tennis refresh failed; the site keeps the last snapshot."
      - name: Refresh college football data (Gridiron; only new games are fetched; site files are rebuilt from the committed cache)
        run: node apps/football/scripts/fetch-cfb.mjs || echo "::warning::Football refresh failed; pages are rebuilt from the committed cache."
      - name: Save refreshed current-season data snapshots
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || github.event_name == 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json public/data/ .cache/ apps/tennis/public/data/app/ apps/tennis/data-cache/ apps/football/data-cache/
          if ! git diff --cached --quiet; then
            git commit -m 'Update 2026-27 basketball data snapshots'
            # main may have moved during the run (a merge or an overlapping refresh): replay on top, ours wins.
            git push || { git pull --rebase -X theirs && git push; } || { git rebase --abort 2>/dev/null || true; echo "::warning::Data snapshot push skipped; the next refresh will retry."; }
          fi
      - name: Test the injury engine
        run: node --test scripts/lib/injuries.test.mjs
      - name: Typecheck and test (all sites and shared packages)
        run: |
          npm run typecheck
          npm run typecheck -w @sites/tennis
          npm run typecheck -w @sites/football
          npm test
      - name: Build app data layer and static site
        run: npm run build
        env:
          # Paths follow the repo name, so renaming the repo can't break the sites.
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}/d1-hoops
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/d1-hoops
          # Optional: URL of the live relay (live/), set as a repository variable LIVE_URL.
          NEXT_PUBLIC_LIVE_URL: ${{ vars.LIVE_URL }}
      - name: Build the tennis site
        run: npm run build -w @sites/tennis
        env:
          SITE_BASE_PATH: /${{ github.event.repository.name }}/tennis
      - name: Build the college football site
        run: npm run build -w @sites/football
        env:
          SITE_BASE_PATH: /${{ github.event.repository.name }}/football
      - name: Assemble the Pages site (hub at /, D1 Hoops at /d1-hoops/, tennis at /tennis/, football at /football/)
        run: |
          rm -rf pages && mkdir -p pages
          cp -r out pages/d1-hoops
          # Raw pipeline inputs no page loads (~21 MB). They stay in the repo for the build; just not served.
          rm -rf pages/d1-hoops/data/team-season-2027.json pages/d1-hoops/data/player-details-2027 \
            pages/d1-hoops/data/player-season-2027.json pages/d1-hoops/data/game-team-boxscores-2027.json \
            pages/d1-hoops/data/feeds-2027.json pages/d1-hoops/data/espn-rosters-2027.json
          cp -r apps/tennis/out pages/tennis
          cp -r apps/football/out pages/football
          cp site-hub/index.html pages/index.html
          cp site-hub/404.html pages/404.html
          touch pages/.nojekyll
      - name: Save the injury ledger and the daily DPR snapshot (both written by the build)
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || github.event_name == 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/injury-ledger-2027.json
          # DPR history: once a day (full refresh, pushes, manual runs), not every hourly build. Hourly
          # builds overwrite the same date, so nothing is lost, and the repo doesn't grow by a blob an hour.
          if [ "${{ github.event_name }}" != "schedule" ] || [ "${{ github.event.schedule }}" = "30 11 * * *" ]; then git add .cache/dpr-history.json.gz; fi
          if ! git diff --cached --quiet; then
            git commit -m 'Update injury ledger and DPR history'
            git push || { git pull --rebase -X theirs && git push; } || { git rebase --abort 2>/dev/null || true; echo "::warning::Injury ledger push skipped; the next refresh will retry."; }
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
