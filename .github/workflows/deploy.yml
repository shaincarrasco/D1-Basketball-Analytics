name: Deploy D1 Hoops to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "30 11 * * *" # full refresh (College Basketball Data + ESPN), 6:30 a.m. ET
    - cron: "0 4 * * *"   # late-night ESPN-only refresh: box scores, play-by-play, lines (11 p.m. ET)
    - cron: "0 7 * * *"   # after West Coast games (2 a.m. ET)
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Audit dependency vulnerabilities
        run: |
          npm audit --json > "$RUNNER_TEMP/npm-audit.json" || true
          node -e 'const a = JSON.parse(require("node:fs").readFileSync(process.env.RUNNER_TEMP + "/npm-audit.json", "utf8")); console.log("Dependency audit:", JSON.stringify(a.metadata?.vulnerabilities ?? {})); for (const [name, item] of Object.entries(a.vulnerabilities ?? {})) console.log(name + ": " + item.severity + " | range " + item.range + " | fix " + JSON.stringify(item.fixAvailable));'
      - name: Fetch and validate current-season player stats
        if: (github.event_name != 'schedule' || github.event.schedule == '30 11 * * *') && (github.event_name != 'push' || contains(github.event.head_commit.message, '[refresh-data]') || !hashFiles('public/data/team-season-2027.json') || !hashFiles('public/data/player-season-2027.json') || !hashFiles('public/data/games-season-2027.json') || !hashFiles('public/data/game-team-boxscores-2027.json') || !hashFiles('public/data/player-details-2027/*.json'))
        run: node scripts/fetch-player-stats.mjs
        env:
          CBBD_API_KEY: ${{ secrets.CBBD_API_KEY }}
      - name: Fetch current-season team statistics and ratings
        if: (github.event_name != 'schedule' || github.event.schedule == '30 11 * * *') && (github.event_name != 'push' || contains(github.event.head_commit.message, '[refresh-data]') || !hashFiles('public/data/team-season-2027.json') || !hashFiles('public/data/player-season-2027.json') || !hashFiles('public/data/games-season-2027.json') || !hashFiles('public/data/game-team-boxscores-2027.json') || !hashFiles('public/data/player-details-2027/*.json'))
        run: node scripts/fetch-team-stats.mjs
        env:
          CBBD_API_KEY: ${{ secrets.CBBD_API_KEY }}
      - name: Fetch and validate current-season game schedule and results
        if: (github.event_name != 'schedule' || github.event.schedule == '30 11 * * *') && (github.event_name != 'push' || contains(github.event.head_commit.message, '[refresh-data]') || !hashFiles('public/data/team-season-2027.json') || !hashFiles('public/data/player-season-2027.json') || !hashFiles('public/data/games-season-2027.json') || !hashFiles('public/data/game-team-boxscores-2027.json') || !hashFiles('public/data/player-details-2027/*.json'))
        run: node scripts/fetch-games.mjs
        env:
          CBBD_API_KEY: ${{ secrets.CBBD_API_KEY }}
      - name: Fetch last season's ratings once (preseason prior for DHR)
        if: github.event_name != 'schedule' || github.event.schedule == '30 11 * * *'
        run: node scripts/fetch-prior-ratings.mjs
        env:
          CBBD_API_KEY: ${{ secrets.CBBD_API_KEY }}
      - name: Fetch player game logs and roster bios (ESPN, incremental)
        continue-on-error: true
        run: node scripts/fetch-espn-player-games.mjs
      - name: Fetch recruiting star ratings (non-fatal)
        if: github.event_name != 'schedule' || github.event.schedule == '30 11 * * *'
        continue-on-error: true
        run: node scripts/fetch-recruiting.mjs
        env:
          CBBD_API_KEY: ${{ secrets.CBBD_API_KEY }}
      - name: Calculate DHR v2 ratings, walk-forward predictions and backtest
        run: node scripts/build-power-ratings.mjs
      - name: Simulate the rest of the season
        run: node scripts/build-simulations.mjs
      - name: Fetch player shooting profiles weekly
        if: github.event_name != 'schedule' || github.event.schedule == '30 11 * * *'
        run: node scripts/fetch-player-shooting.mjs
        env:
          CBBD_API_KEY: ${{ secrets.CBBD_API_KEY }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
      - name: Save refreshed current-season data snapshots
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || github.event_name == 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json public/data/ .cache/
          if ! git diff --cached --quiet; then
            git commit -m 'Update 2026-27 basketball data snapshots'
            git push
          fi
      - name: Typecheck
        run: npm run typecheck
      - name: Build app data layer and static site
        run: npm run build
        env:
          # Optional: URL of the live relay (live/), set as a repository variable LIVE_URL.
          NEXT_PUBLIC_LIVE_URL: ${{ vars.LIVE_URL }}
        env:
          NEXT_PUBLIC_BASE_PATH: /D1-Basketball-Analytics
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
