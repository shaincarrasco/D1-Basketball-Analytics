[package]
name = "d1hoops-live"
version = "0.1.0"
edition = "2021"
description = "D1 Hoops app server: static site, live score relay (SSE), accounts (Neon Auth), Stripe subscriptions, web-push alerts; plus the feeds aggregator."
license = "MIT"

[[bin]]
name = "d1hoops-live"
path = "src/main.rs"

[[bin]]
name = "feeds"
path = "src/bin/feeds.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.6", features = ["cors", "compression-gzip", "fs", "set-header"] }
tokio-postgres = { version = "0.7", features = ["with-serde_json-1", "with-chrono-0_4"] }
deadpool-postgres = "0.14"
tokio-postgres-rustls = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "0.26"
jsonwebtoken = "9"
base64 = "0.22"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
web-push = { version = "0.11", default-features = false, features = ["hyper-client"] }
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
chrono-tz = "0.10"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
