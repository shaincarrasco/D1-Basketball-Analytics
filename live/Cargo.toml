[package]
name = "d1hoops-live"
version = "0.1.0"
edition = "2021"
description = "Low-latency live score relay for D1 Hoops: polls ESPN's public scoreboard and pushes changes to browsers over Server-Sent Events."
license = "MIT"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.6", features = ["cors", "compression-gzip"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
chrono-tz = "0.10"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
